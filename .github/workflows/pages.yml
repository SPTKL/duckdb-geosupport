name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'scripts/build-docs.py'
      - 'resources/layouts.json'
      - 'src/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'scripts/build-docs.py'
      - 'resources/layouts.json'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build documentation and verify sample provenance
        run: python scripts/build-docs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
