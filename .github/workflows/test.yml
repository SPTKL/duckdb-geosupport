name: Native Linux validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        duckdb: ['1.5.6']
    env:
      DUCKDB_VERSION: ${{ matrix.duckdb }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ make libcurl4-openssl-dev libssl-dev curl unzip jq strace
      - name: Build, test real releases, and benchmark without Python or Docker
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          strace --seccomp-bpf -f -e trace=execve -s 4096 -o build/reports/native-exec.log \
            bash scripts/ci-native.sh 2>&1 | tee build/reports/native.log
      - name: Audit executed programs
        if: always()
        run: bash scripts/audit-native-execs.sh build/reports/native-exec.log
      - name: Benchmark summary
        run: |
          {
            echo '### Native Linux benchmark'
            echo '| Workload | Rows/second |'
            echo '| --- | ---: |'
            jq -r '"| Cold unique requests (median of 3) | \(.cold_median_rows_per_second | floor) |", "| Warm worker cache (median of 3) | \(.warm_median_rows_per_second | floor) |"' "build/reports/$DUCKDB_VERSION/benchmark.json"
            echo
            jq -r '.limitations' "build/reports/$DUCKDB_VERSION/benchmark.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-results-${{ matrix.duckdb }}
          path: |
            build/reports/
            build/native/*/*.tar.gz
          if-no-files-found: error
