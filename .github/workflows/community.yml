name: Community extension build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        include:
          - duckdb: v1.5.6
            commit: ''
          # Current community repository target, inspected 2026-10-24.
          - duckdb: v2.0.0
            commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@2de802913caf5c9bba0ef267658b20f3cc0486c3
    with:
      extension_name: geosupport
      duckdb_version: ${{ matrix.duckdb }}
      duckdb_commit: ${{ matrix.commit }}
      ci_tools_version: 2de802913caf5c9bba0ef267658b20f3cc0486c3
      extra_toolchains: python3
      exclude_archs: 'linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;windows_amd64_rtools;wasm_mvp;wasm_eh;wasm_threads'
  offline:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        duckdb: ['v1.5.6', 'main']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libssl-dev
      - name: Build and run offline SQL tests
        env:
          DUCKDB_TEST_VERSION: ${{ matrix.duckdb }}
          GEN: ninja
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          make configure
          make release
          make test_release
